name: Polymarket live strategy

# Manual dispatch only -- NOT scheduled. Polymarket geoblocks order
# placement from GitHub Actions' runner IPs (403 "Trading restricted in
# your region" on every attempt, confirmed empirically), so a scheduled
# --live run here can never actually fill anything; live execution now
# runs on a local Windows Task Scheduler job instead (see
# scripts/run_live_strategy_scheduled.ps1), which both places real orders
# successfully and pushes state back to this repo. Running both on a
# schedule would also race the same commit (results/polymarket_live_test/).
# Kept as workflow_dispatch for manual dry-run scanning/diagnostics only.
# Never add a schedule or pull_request trigger back without re-verifying
# the geoblock status first -- pull_request in particular would expose
# repo secrets to workflow runs triggered from forks (this repo is public).
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Submit real orders (unchecked = dry run) -- will fail with a 403 geoblock; kept for re-testing only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: polymarket-live-trade
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run strategy
        env:
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_PROXY_ADDRESS: ${{ secrets.POLYMARKET_PROXY_ADDRESS }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.live }}" = "true" ]; then
            python scripts/run_live_strategy.py --usd 3 --live
          else
            python scripts/run_live_strategy.py --usd 3
          fi

      - name: Commit updated trade log / open positions
        run: |
          git config user.name "polymarket-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/polymarket_live_test/trade_log.csv results/polymarket_live_test/open_positions.json
          git diff --cached --quiet || git commit -m "Autonomous live strategy run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
